id = "hlouis.glab"
name = "GitLab MR"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "GitLab merge request panel, worktree checkout, tuicr review, and workspace MR status tokens."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "install.sh"]

# 服务启动时拉起后台 poller；link/enable 不触发 startup，由下面的事件钩子补启动。
[[startup]]
command = ["bin/herdr-glab", "ensure"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-glab", "tokens"]

[[events]]
on = "workspace.focused"
command = ["bin/herdr-glab", "tokens"]

[[events]]
on = "worktree.created"
command = ["bin/herdr-glab", "tokens"]

[[events]]
on = "worktree.opened"
command = ["bin/herdr-glab", "tokens"]

[[actions]]
id = "panel"
title = "GitLab: open MR panel"
contexts = ["global"]
command = ["bin/herdr-glab", "panel-open"]

[[actions]]
id = "refresh"
title = "GitLab: refresh MR data"
contexts = ["global"]
command = ["bin/herdr-glab", "refresh"]

[[actions]]
id = "stop-poller"
title = "GitLab: stop MR poller"
contexts = ["global"]
command = ["bin/herdr-glab", "stop"]

[[actions]]
id = "link"
title = "GitLab: open the clicked MR"
contexts = ["global"]
command = ["bin/herdr-glab", "link-open"]

# Keyboard path to the same pane: the selected text, else the clipboard.
[[actions]]
id = "url"
title = "GitLab: open the selected or copied MR"
contexts = ["global"]
command = ["bin/herdr-glab", "url-open"]

# Ctrl+click any GitLab MR URL in a pane. The host is checked at runtime: a
# manifest pattern cannot be templated with the configured host.
[[link_handlers]]
id = "mr"
title = "Open GitLab MR"
pattern = "^https?://[^/]+/.+/-/merge_requests/[0-9]+([/#?].*)?$"
action = "link"

[[panes]]
id = "panel"
title = "GitLab MRs"
placement = "overlay"
command = ["bin/herdr-glab", "panel"]

[[panes]]
id = "mr"
title = "GitLab MR"
placement = "overlay"
command = ["bin/herdr-glab", "detail"]
