version: 2
project_name: herdr-glab

builds:
  - main: ./cmd/herdr-glab
    binary: herdr-glab
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  # install.sh downloads this exact name when the machine has no Go toolchain.
  - name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
